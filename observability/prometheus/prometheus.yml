# Scrapes only real exporters: the Spark stream (prometheus_client in the driver), the control-plane API (probe,
# Kafka lag, replication-slot and heartbeat gauges) and MinIO. Validated in CI with `promtool check config`.
global:
  scrape_interval: 10s
  evaluation_interval: 10s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: spark-stream
    static_configs:
      - targets: ["spark:9108"]
  - job_name: lakeflow-api
    metrics_path: /api/metrics
    static_configs:
      - targets: ["api:8000"]
  - job_name: minio
    metrics_path: /minio/v2/metrics/cluster
    static_configs:
      - targets: ["minio:9000"]
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
