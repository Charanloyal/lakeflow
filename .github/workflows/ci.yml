name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python lint + unit tests (${{ matrix.python }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install tooling
        run: |
          pip install -r requirements-dev.txt
          if [ "${{ matrix.python }}" = "3.12" ]; then pip install -r api/requirements.txt; fi
      - name: Ruff lint
        if: matrix.python == '3.12'
        run: ruff check --output-format=github .
      - name: Ruff format
        if: matrix.python == '3.12'
        run: |
          if ! ruff format --check . > .ruff-format.txt 2>&1; then
            cat .ruff-format.txt
            python scripts/ci_annotate.py lines error "ruff format --check" < .ruff-format.txt
            exit 1
          fi
      - name: Contracts are valid JSON Schema 2020-12
        run: |
          python - <<'PY'
          import glob, json, jsonschema
          for path in glob.glob("contracts/**/v*.schema.json", recursive=True):
              jsonschema.Draft202012Validator.check_schema(json.load(open(path)))
              print("ok", path)
          PY
      - name: Unit tests (core library, stdlib-only; 3.10 = Spark runtime interpreter)
        run: python -m pytest -q tests/unit api/tests/test_domain.py --junitxml=.artifacts/unit.xml
      - name: API tests (FastAPI TestClient, fake dependencies)
        if: matrix.python == '3.12'
        run: python -m pytest -q api/tests/test_app.py --junitxml=.artifacts/api.xml
      - name: Annotate failures
        if: failure()
        run: |
          python scripts/ci_annotate.py junit .artifacts/unit.xml "unit ${{ matrix.python }}"
          python scripts/ci_annotate.py junit .artifacts/api.xml "api" || true

  spark:
    name: PySpark sink semantics (runtime image)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Generate local .env
        run: python3 scripts/lakeflowctl.py bootstrap --skip-docker
      - name: Build Spark runtime + test images
        run: docker compose --profile tools build spark spark-tests
      - name: Run PySpark tests against the exact runtime jars and interpreter
        run: |
          mkdir -p .artifacts && chmod 777 .artifacts
          docker compose --profile tools run --rm -v "$PWD/.artifacts:/artifacts" spark-tests --junitxml=/artifacts/spark.xml
      - name: Annotate failures
        if: failure()
        run: python3 scripts/ci_annotate.py junit .artifacts/spark.xml spark

  data-plane:
    name: CDC data plane end-to-end (compose, no mocks)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GIT_SHA: ${{ github.sha }}
      CI_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v7
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Bootstrap (.env with generated secrets)
        run: python3 scripts/lakeflowctl.py --profile 8gb bootstrap --skip-docker
      - name: Start data plane and wait for health
        run: python3 scripts/lakeflowctl.py --profile 8gb up --data-plane --timeout 900
      - name: Integration tests (PostgreSQL -> Debezium -> Kafka -> Spark -> Iceberg -> Trino)
        run: |
          mkdir -p .artifacts
          python3 scripts/lakeflowctl.py --profile 8gb integration-test tests/integration --junitxml=.artifacts/integration.xml -rA
      - name: Annotate failures
        if: failure()
        run: |
          python3 scripts/ci_annotate.py junit .artifacts/integration.xml integration
          python3 scripts/ci_annotate.py compose --profile 8gb
      - name: Stop
        if: always()
        run: python3 scripts/lakeflowctl.py --profile 8gb down --volumes || true

  observability-config:
    name: Prometheus config + alert rule unit tests (promtool)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: promtool check config
        run: >-
          docker run --rm -v "$PWD/observability/prometheus:/etc/prometheus:ro" --entrypoint promtool
          prom/prometheus:v2.55.1 check config /etc/prometheus/prometheus.yml
      - name: promtool test rules
        run: >-
          docker run --rm -v "$PWD/observability/prometheus:/etc/prometheus:ro" -w /etc/prometheus/tests
          --entrypoint promtool prom/prometheus:v2.55.1 test rules alerts_test.yml

  frontend:
    name: Frontend lint + typecheck + static build
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install
        run: if [ -f package-lock.json ]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi
      - name: Prettier
        run: |
          if ! npx prettier --check . > ../.prettier.txt 2>&1; then
            cat ../.prettier.txt; python3 ../scripts/ci_annotate.py lines error "prettier --check" < ../.prettier.txt; exit 1
          fi
      - name: ESLint
        run: |
          if ! npx eslint . --format unix > ../.eslint.txt 2>&1; then
            cat ../.eslint.txt; python3 ../scripts/ci_annotate.py lines error "eslint" < ../.eslint.txt; exit 1
          fi
      - name: Build (next build type-checks the app)
        run: |
          if ! npm run build > ../.build.txt 2>&1; then
            cat ../.build.txt; python3 ../scripts/ci_annotate.py lines error "next build" < ../.build.txt; exit 1
          fi

  full-stack:
    name: Full stack e2e, 16gb profile (API, UI, Airflow, Prometheus, Grafana)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GIT_SHA: ${{ github.sha }}
      CI_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      LAKEFLOW_REQUIRE_PROFILES: observability,maintenance
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Bootstrap
        run: python3 scripts/lakeflowctl.py --profile 16gb bootstrap --skip-docker
      - name: Start the platform (core + API + UI + Airflow + Prometheus + Grafana) and wait for health
        run: python3 scripts/lakeflowctl.py --profile 16gb up --timeout 1500
      - name: Airflow DAG integrity (real image)
        run: python3 scripts/lakeflowctl.py --profile 16gb check-dags
      - name: API, Airflow and observability end-to-end scenarios
        run: |
          mkdir -p .artifacts
          python3 scripts/lakeflowctl.py --profile 16gb integration-test tests/e2e --junitxml=.artifacts/e2e.xml -rA
      - name: Install Playwright
        working-directory: frontend
        run: |
          if [ -f package-lock.json ]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi
          npx playwright install --with-deps chromium
      - name: UI tests (Playwright against the running stack)
        working-directory: frontend
        run: |
          set -a; . ../.env; set +a
          mkdir -p test-results/screenshots
          npx playwright test
      - name: Upload screenshots and reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ui-evidence
          path: |
            frontend/test-results
            frontend/playwright-report
          if-no-files-found: ignore
      - name: Annotate failures
        if: failure()
        run: |
          python3 scripts/ci_annotate.py junit .artifacts/e2e.xml e2e
          python3 scripts/ci_annotate.py junit frontend/test-results/junit.xml ui
          python3 scripts/ci_annotate.py compose --profile 16gb
      - name: Stop
        if: always()
        run: python3 scripts/lakeflowctl.py --profile 16gb down --volumes || true
