name: Security

on:
  push:
    branches: [main, lakeflow-v2]
  pull_request:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secrets:
    name: Secret scan (gitleaks, full history)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: gitleaks
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/repo" zricethezav/gitleaks:v8.28.0 \
            git /repo --redact --no-banner --log-opts="archive/v1-simulation..HEAD" \
            --report-format json --report-path /repo/gitleaks.json || status=$?
          python3 - <<'PY'
          import json, os
          findings = json.load(open("gitleaks.json")) if os.path.exists("gitleaks.json") else []
          for f in findings:
              print(f"::error file={f['File']},line={f['StartLine']}::gitleaks {f['RuleID']} in {f['Commit'][:7]}")
          print(f"{len(findings)} findings")
          PY
          exit ${status:-0}

  dependencies:
    name: Dependency audit (pip-audit, npm audit)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: pip-audit (API + tooling)
        run: |
          pip install "pip-audit==$(grep -Po '(?<=^pip-audit==).*' requirements-dev.txt)"
          pip-audit -r api/requirements.txt -r requirements-dev.txt --progress-spinner off -f json -o pip-audit.json || status=$?
          python3 - <<'PY'
          import json
          doc = json.load(open("pip-audit.json"))
          for dep in doc.get("dependencies", []):
              for vuln in dep.get("vulns", []):
                  fixed = ", ".join(vuln.get("fix_versions", [])) or "none"
                  print(f"::error title=pip-audit::{dep['name']}=={dep['version']} {vuln['id']} (fixed in {fixed})")
          PY
          exit ${status:-0}
      - name: npm audit (production dependencies)
        working-directory: frontend
        run: |
          if [ -f package-lock.json ]; then npm audit --omit=dev --audit-level=high; else echo "no lockfile yet"; fi
