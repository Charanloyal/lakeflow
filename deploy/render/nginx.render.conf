server {
    listen 10000;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;
    # Behind Render's proxy: redirect with relative Locations, never to the internal :10000 port.
    absolute_redirect off;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = / {
        return 302 /lakeflow/;
    }

    location /lakeflow/_next/static/ {
        expires 1y;
        try_files $uri =404;
    }

    location /lakeflow/ {
        try_files $uri $uri/ $uri.html =404;
    }
}
