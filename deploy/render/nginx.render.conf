server {
    listen 10000;
    server_name _;
    server_tokens off;
    # Behind Render's proxy: redirect with relative Locations, never to the internal :10000 port.
    absolute_redirect off;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = / {
        return 302 /lakeflow/;
    }

    location = /lakeflow {
        return 301 /lakeflow/;
    }

    location /lakeflow/ {
        proxy_pass https://charanloyal.github.io;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 3;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        # Pages redirects directory paths with absolute URLs; keep visitors on this host.
        proxy_redirect https://charanloyal.github.io/ /;
    }
}
