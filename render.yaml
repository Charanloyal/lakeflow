# Render Blueprint: mirrors the recorded demo (a static snapshot of a real CI end-to-end run) on the free plan.
# The live stack needs about 6 GB of RAM (Kafka, Spark, Trino), so it runs in Codespaces or locally.
# Same service name and Dockerfile path as v1, so the existing service updates in place.
services:
  - type: web
    name: lakeflow-demo
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: PORT
        value: 10000
